# Local-only configuration for the dedicated portfolio demo backend.
# Cloud secrets and the remote project reference never belong in this file.
project_id = "portfolio-live-demos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "cn_demo", "rcmi_demo", "hours_demo", "payroll_demo"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false
max_buckets = 1
max_indexes = 1

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 2
anonymous_users = 0
token_refresh = 60
sign_in_sign_ups = 20
token_verifications = 20
web3 = 0

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "60s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.reset-coordinator]
verify_jwt = false

[functions.cn-api]
verify_jwt = false

[functions.rcmi-api]
verify_jwt = false

[functions.hours-api]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"
