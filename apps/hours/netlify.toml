[build]
  command = "npm run build --workspace @pauuu-demo/hours"
  publish = "apps/hours/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/hours packages/demo-shell package.json package-lock.json .nvmrc .npmrc"

[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "11.11.0"
  NPM_FLAGS = "--ignore-scripts"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://ivqfxdibluhgyttgxbmz.supabase.co; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self' 'sha256-8afa7h3I88xPnCVXHX/YHu8UQqEVKMMvIJamyqL8aj8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
