  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://payroll-demo.pauuu.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="P-Devs Demos" />
    <meta property="og:title" content="Payroll Splitter Demo | P-Devs" />
    <meta property="og:description" content="Interactive P-Devs payroll calculator demo for splitting USD and PHP pay by hours rendered." />
    <meta property="og:url" content="https://payroll-demo.pauuu.dev/" />
    <meta property="og:image" content="https://pauuu.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Payroll Splitter Demo | P-Devs" />
    <meta name="twitter:description" content="Interactive P-Devs payroll calculator demo for splitting pay by hours rendered." />
    <meta name="twitter:image" content="https://pauuu.dev/og-image.png" />
    <title>Payroll Splitter Demo | P-Devs</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"Payroll Splitter Demo","url":"https://payroll-demo.pauuu.dev/","description":"Interactive P-Devs payroll calculator demo for splitting USD and PHP pay by hours rendered.","applicationCategory":"FinanceApplication","operatingSystem":"Web","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"creator":{"@type":"Person","name":"Pau","alternateName":"P-Devs","url":"https://pauuu.dev/"},"isPartOf":{"@type":"WebSite","name":"P-Devs Portfolio","url":"https://pauuu.dev/"}}
    </script>
    <link
      rel="preload"
      href="/assets/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      portfolio-demo-notice:not(:defined) {
        display: block;
        min-height: 8.5rem;
        background: #111827;
      }

      @media (max-width: 44rem) {
        portfolio-demo-notice:not(:defined) {
          min-height: 13.95rem;
        }
      }
    </style>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <portfolio-demo-notice project-id="payroll"></portfolio-demo-notice>
    <main class="wrapper">
      <!-- HEADER -->
      <header>
        <h1 class="header-badge">Payroll Splitter</h1>
        <div class="header-sub">Salary Split · USD ↔ PHP</div>
      </header>

      <!-- ─── SECTION 1: USD INPUTS ─── -->
      <h2 class="section-label">USD Setup</h2>
      <div class="card">
        <div class="input-grid">
          <div class="field">
            <label for="totalUSD">Total Pay (USD)</label>
            <div class="currency-wrap">
              <span class="currency-prefix">$</span>
              <input
                type="number"
                id="totalUSD"
                placeholder="0.00"
                min="0"
                max="10000000"
                step="0.01"
              />
            </div>
          </div>
          <div class="field">
            <label for="rateUSD">Rate per Hour (USD)</label>
            <div class="currency-wrap">
              <span class="currency-prefix">$</span>
              <input
                type="number"
                id="rateUSD"
                placeholder="0.00"
                min="0"
                max="100000"
                step="0.01"
              />
            </div>
          </div>
          <div class="field">
            <label for="conversionRate">USD → PHP Conversion Rate</label>
            <div class="currency-wrap">
              <span class="currency-prefix">₱</span>
              <input
                type="number"
                id="conversionRate"
                placeholder="0.00"
                min="0"
                max="1000"
                step="0.01"
              />
            </div>
            <div class="rate-note">
              Enter the current exchange rate manually.
            </div>
          </div>
        </div>
      </div>

      <!-- ─── SECTION 2: HOURS ─── -->
      <h2 class="section-label">Hours Rendered</h2>
      <div class="card">
        <!-- Employee Manager Controls -->
        <div class="employee-manager">
          <div
            style="font-size: 0.8rem; font-weight: 600; color: var(--text-dim)"
          >
            Persons
          </div>
          <div class="employee-controls">
            <button
              type="button"
              class="btn-emp minus"
              id="btnRemoveEmp"
              title="Remove person"
              aria-label="Remove person"
            >
              <span class="btn-emp__icon" aria-hidden="true">−</span>
            </button>
            <span class="emp-count-label" id="empCountLabel">2 employees</span>
            <button
              type="button"
              class="btn-emp plus"
              id="btnAddEmp"
              title="Add person"
              aria-label="Add person"
            >
              <span class="btn-emp__icon" aria-hidden="true">+</span>
            </button>
          </div>
        </div>

        <!-- Column headers -->
        <div class="hours-header">
          <div class="hours-col-label">Person</div>
          <div class="hours-col-label">Hours</div>
        </div>

        <!-- Total Hours row -->
        <div class="total-hours-row">
          <div class="total-hours-inner">
            <label class="total-hours-label" for="totalHours">
              <span class="clock-icon" aria-hidden="true">◷</span>
              Total Hours
            </label>
            <div class="emp-hours-wrap">
              <span class="emp-hours-prefix" style="color: var(--text-muted)">
                <span class="clock-icon" aria-hidden="true">◷</span>
              </span>
              <input
                type="number"
                id="totalHours"
                class="emp-hours-input"
                placeholder="0"
                min="0"
                max="10000"
                step="0.5"
              />
            </div>
          </div>
        </div>

        <!-- Employee rows -->
        <div id="employeeList"></div>

        <div class="warn-text" id="hoursWarn" role="status" aria-live="polite">
          ⚠ Combined person hours do not match the Total Hours.
        </div>
      </div>

      <!-- ─── SECTION 3: RESULTS ─── -->
      <h2 class="section-label">Computation</h2>
      <div id="resultsArea" aria-live="polite">
        <div class="results-card">
          <div class="empty-state">
            <div class="empty-icon">🧮</div>
            Enter values above to start the computation.
          </div>
        </div>
      </div>

      <footer>Payroll Splitter · USD ↔ PHP</footer>
    </main>

    <!-- STICKY CLEAR BUTTON -->
    <div class="sticky-bar">
      <button type="button" class="btn-clear" id="btnClear">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 .49-4.95" />
        </svg>
        Clear All
      </button>
    </div>

    <script type="module" src="/assets/js/script.js"></script>
  </body>
</html>
