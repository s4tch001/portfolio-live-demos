    <meta name="description" content="Disposable portfolio preview of the Sunset-Speaks class management project." />

    <link rel="icon" href="/assets/img/logo/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/img/logo/apple-touch-icon.png" />
    <!-- Pre-paint theme: set data-theme before first paint to avoid FOUC.
         Ported verbatim from the legacy theme.js — must run before React mounts. -->
    <script>
      (function () {
        var t = 'light';
        try {
          t = localStorage.getItem('theme') || 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- All libraries self-hosted (China deployment: no Google/CDN hosts) -->

    <script src="/vendor/jszip/jszip.min.js"></script>
