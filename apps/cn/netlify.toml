[build]
  command = "npm run build --workspace @pauuu-demo/cn"
  publish = "apps/cn/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/cn packages/demo-shell package.json package-lock.json .nvmrc .npmrc"

[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "11.11.0"
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://ivqfxdibluhgyttgxbmz.supabase.co; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://ivqfxdibluhgyttgxbmz.supabase.co; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; script-src 'self' 'sha256-KQyeOCpK1uZ1VxNPBl6DqjF07lAZYn1O7fHtJGmQbuQ='; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
